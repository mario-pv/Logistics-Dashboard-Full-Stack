services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: logistics-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logistics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: logistics-cache
    ports:
      - "6379:6379"

volumes:
  pgdata:
